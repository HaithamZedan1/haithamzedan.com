# How nginx serves the site inside the container image.
#
# Staging and production are Cloudflare Pages. This file makes the image answer the same way:
#   - the headers Pages adds to every response by default
#   - the rules in ../_headers  (tests/site.test.mjs fails if the two drift apart)
# so the image is a faithful, portable copy of the live site.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Cloudflare Pages defaults.
    add_header Access-Control-Allow-Origin "*" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    # Like a Pages preview URL: keep copies of the site out of search engines.
    add_header X-Robots-Tag "noindex" always;

    # _headers: /api/*
    # (nginx drops the server-level headers inside a location that sets its own,
    #  so they are repeated here.)
    location /api/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "public, max-age=3600";
        default_type application/json;
    }

    # _headers: /llms.txt, /llms-full.txt and /.well-known/* only ask for
    # Access-Control-Allow-Origin: *, which every response above already carries.
    location = /llms.txt      { default_type text/plain; }
    location = /llms-full.txt { default_type text/plain; }
    location /.well-known/    { default_type application/json; }

    # _headers is configuration for Cloudflare, not a page.
    location = /_headers { return 404; }

    location / { try_files $uri $uri/ =404; }
}
