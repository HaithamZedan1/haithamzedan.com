# haithamzedan.com: from commit to production, securely.
#
#   1 Test ─┐
#           ├─ 3 Build image ─ 3 Scan image ─ 4 Deploy to staging ─ 4 Scan staging ─ approval ─ 5 Publish
#   2 Scan ─┘
#
# Staging is a Cloudflare Pages preview. Production is the same Pages project, after approval.
# Everything here runs on GitHub's free runners and Cloudflare's free plan: no server to manage.
#
# Three rules shape this file:
#   - Every action is pinned to a full commit SHA. A tag can be moved to other code; a SHA cannot.
#   - Every job gets the smallest set of token permissions it needs.
#   - Jobs that run third-party scanners never hold write access or the Cloudflare token.

name: Pipeline

on:
  push:
    branches: [main, "demo/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Default for every job: a read-only token. Jobs below add only what they need.
permissions:
  contents: read

env:
  PAGES_PROJECT: haithamzedan # must match the Pages project in the Cloudflare dashboard
  STAGING_URL: https://staging.haithamzedan.pages.dev
  PRODUCTION_URL: https://haithamzedan.pages.dev
  SITE_URL: https://haithamzedan.com

jobs:
  # ── 1 · Test ─────────────────────────────────────────────────────────────────────────────
  test:
    name: 1 · Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Site checks
        run: node --test tests/site.test.mjs

  # ── 2 · Scan code ────────────────────────────────────────────────────────────────────────
  scan-code:
    name: 2 · Scan code
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so every new commit can be checked for secrets
          persist-credentials: false

      - name: Secrets (Gitleaks)
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash ci/scan-secrets.sh

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Insecure code patterns (Semgrep)
        run: |
          python -m pip install --quiet semgrep==1.185.0
          semgrep scan --config p/default --severity ERROR --error --metrics off

      - name: The pipeline itself (zizmor)
        run: |
          python -m pip install --quiet zizmor==1.32.0
          zizmor --offline --min-severity medium .github/workflows/

  # Everything below runs only for main. Branches and pull requests stop after the scans.

  # ── 3 · Build image ──────────────────────────────────────────────────────────────────────
  # Runs only our own commands: this is the one job allowed to write to the registry.
  build:
    name: 3 · Build image
    needs: [test, scan-code]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push the image to GitHub's container registry
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      # Build once. The same dist/ goes into the image, to staging and, after approval, to production.
      - name: Assemble the site into dist/
        run: bash ci/assemble.sh

      - name: Keep dist/ for the deploy stages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist
          include-hidden-files: true # dist/.well-known must travel too
          if-no-files-found: error

      - name: Build the image
        run: docker build --pull --tag "ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA" .

      - name: Push to the registry
        id: push
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$image"
          # Hand the next job the image's digest, so it scans exactly the bytes that were pushed.
          echo "image=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")" >> "$GITHUB_OUTPUT"

  # ── 3 · Scan image ───────────────────────────────────────────────────────────────────────
  # Nothing is deployed until this job passes.
  scan-image:
    name: 3 · Scan image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read # pull the image from the registry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull the image that was just built
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker pull --quiet "$IMAGE"
          docker tag "$IMAGE" site:scan
          docker logout ghcr.io

      - name: Start the image and check it serves this commit
        run: |
          docker run --detach --name site --publish 8080:8080 site:scan
          if ! bash ci/check-live.sh http://localhost:8080; then
            docker logs site
            exit 1
          fi
          docker rm --force site

      - name: Vulnerabilities in the image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: site:scan
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Software bill of materials (Syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: site:scan
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.spdx.json
          if-no-files-found: error

  # ── 4 · Staging ──────────────────────────────────────────────────────────────────────────
  # A Cloudflare Pages preview of the exact files built in stage 3.
  # The Cloudflare token lives in the "staging" environment and only this job receives it.
  staging:
    name: 4 · Deploy to staging
    needs: [build, scan-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: staging
      url: ${{ env.STAGING_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist

      # Any branch other than Pages' production branch (main) becomes a preview,
      # served at <branch>.<project>.pages.dev.
      - name: Deploy a preview to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.155.0"
          command: pages deploy dist --project-name=${{ env.PAGES_PROJECT }} --branch=staging

      - name: Check staging serves this commit
        run: bash ci/check-live.sh "$STAGING_URL"

  # The scanner attacks the running site from outside. It gets no secrets and no environment.
  dast:
    name: 4 · Scan staging (ZAP)
    needs: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Baseline scan of the running site
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ env.STAGING_URL }}
          # -c: which findings fail, warn or are accepted.  -I: warnings do not fail the run.
          cmd_options: -I -c .zap/rules.tsv
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-report

  # ── 5 · Production ───────────────────────────────────────────────────────────────────────
  # The "production" environment has a required reviewer, so this job waits for a person.
  # Its copy of the Cloudflare token is released only after that approval.
  production:
    name: 5 · Publish to Cloudflare
    needs: [build, dast]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ env.SITE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The dist/ that was built in stage 3 and scanned on staging. Nothing is rebuilt here.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.155.0"
          command: pages deploy dist --project-name=${{ env.PAGES_PROJECT }} --branch=main

      - name: Check production serves this commit
        run: bash ci/check-live.sh "$PRODUCTION_URL"
